{% extends "base.html" %}
{% block title %}登录 · CS Legends{% endblock %}
{% block body_class %}body-auth{% endblock %}

{% block content %}
<section class="auth-card" aria-labelledby="auth-title">
  <h1 id="auth-title">登录</h1>
  <p class="auth-card__lead">登录后进入账号页查看账号信息，目前账号仅提供登录态</p>

  {% if registered %}
  <p class="auth-alert auth-alert--ok">注册成功，请登录</p>
  {% endif %}
  {% if error %}
  <p class="auth-alert auth-alert--error">{{ error }}</p>
  {% endif %}

  <form class="auth-form" method="post" action="/auth/login" novalidate>
    <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label class="auth-field">
      <span>邮箱或用户名</span>
      <input type="text" name="username" autocomplete="username" required autofocus>
    </label>
    <label class="auth-field">
      <span>密码</span>
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit" class="auth-submit">登录</button>
  </form>

  <p class="auth-card__foot">还没有账号？<a href="/register?next={{ next }}">注册一个</a></p>
</section>
{% endblock %}
